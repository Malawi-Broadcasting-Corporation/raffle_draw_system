<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MBC Raffle · On Air</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/tv_display.css') }}">
</head>
<body>
<!-- On-air screen: display only. No buttons, links or cursor; it follows the control screen. -->
<div id="stage" aria-live="polite">
    <div class="bg-gradient"></div>
    <img class="bg-swirl" src="{{ url_for('static', filename='images/mbc-watermark.png') }}" alt="">
    <div class="bg-band"></div>

    <header class="top">
        <div class="title-bar hidden" id="title-bar">
            <span class="live-tag" id="live-tag">LIVE</span>
            <span class="draw-title" id="draw-title"></span>
        </div>
        <div class="logo-plate">
            <img src="{{ url_for('static', filename='images/mbc-logo-colour.png') }}" alt="MBC">
        </div>
    </header>

    <!-- Idle: no draw to show -->
    <section class="idle" id="idle">
        <img class="idle-logo" src="{{ url_for('static', filename='images/mbc-logo-colour.png') }}" alt="MBC">
        <div class="idle-text">Raffle draw coming up</div>
    </section>

    <!-- Main draw view -->
    <section class="main hidden" id="main">
        <div class="prize-label" id="prize-label"></div>
        <div class="number-box" id="number-box">
            <div class="number" id="number">READY</div>
        </div>
        <div class="caption" id="caption"></div>
        <div class="notice hidden" id="notice"></div>
    </section>

    <!-- Results: when every prize has a winner -->
    <section class="results hidden" id="results">
        <h2>Congratulations to our winners</h2>
        <ol id="results-list"></ol>
    </section>

    <aside class="winners-panel hidden" id="winners-panel">
        <h3>Winners</h3>
        <ol id="winners-list"></ol>
    </aside>

    <footer class="bottom">
        <span class="tagline">inspiring the nation</span>
        <span class="proof" id="proof"></span>
    </footer>

    <div id="confetti"></div>
</div>

<script>
    window.TV_CONFIG = {
        drawId: {{ current_draw.draw_id if (pinned and current_draw) else 'null' }},
        pinned: {{ 'true' if pinned else 'false' }},
    };
</script>
<script src="{{ url_for('static', filename='js/tv_display.js') }}"></script>
</body>
</html>
